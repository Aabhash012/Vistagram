spring:
  application:
    name: vistagram
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: Vistagram@12
    driver-class-name: org.postgresql.Driver
    initialization-mode: never  # Enables schema.sql execution
  sql:
    init:
      mode: never         # Always initialize the database
  jpa:
    hibernate:
      ddl-auto: none           # Disable Hibernate schema generation
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: false  # Wait for schema.sql before Hibernate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  file:
    upload-dir: uploads

logging:
  level:
    org.springframework.web: DEBUG
    com.example.vistagram: TRACE

